[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-reg-lists"
version = "0.1.0"
description = "Normalized EU regulatory substance data and exact identity lookup"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["eu_reg_lists"]
include-package-data = true

[tool.setuptools.package-data]
eu_reg_lists = ["py.typed"]
