[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-reg-api"
version = "0.1.0"
description = "Read-only API and browser interfaces for cosmetic ingredient screening"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "eu-reg-lists",
    "eu-ingredient-linter",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
# Browser-playground regression tests (packages/eu-reg-api/tests/test_playground_frontend.py).
# Playwright drives an installed Chromium via channel="chrome"; it is a dev-only
# dependency, never a runtime dependency. Run `make frontend-test`.
browser-test = ["pytest>=8.0", "playwright>=1.30", "httpx>=0.27"]

[project.scripts]
eu-reg-api = "eu_reg_api.main:run"

[tool.setuptools]
packages = ["eu_reg_api"]
include-package-data = true

[tool.setuptools.package-data]
eu_reg_api = ["py.typed", "static/*"]
