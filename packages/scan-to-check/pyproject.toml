[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-to-check"
version = "0.1.0"
description = "Local barcode -> cosmetic product ingredients -> existing checker (Phase 4 first slice)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "eu-reg-lists",
    "eu-ingredient-linter",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
scan-to-check = "scan_to_check.app:run"

[tool.setuptools]
packages = ["scan_to_check"]
include-package-data = true

[tool.setuptools.package-data]
scan_to_check = [
    # PWA shell (html, service worker, manifest, icons) + packages.
    "static/*.html", "static/*.js", "static/*.css", "static/*.json",
    "static/*.webmanifest", "py.typed",
    "static/icons/*.png",
    # Vendored, pinned Tesseract.js v6.0.1 assets (local OCR; no runtime CDN)
    # plus the reproducible vendor manifest and matching Apache-2.0 licenses.
    "static/vendor/tesseract/*.js", "static/vendor/tesseract/*.txt",
    "static/vendor/tesseract/*.gz", "static/vendor/tesseract/*.json",
    "static/vendor/tesseract/core/*.js", "static/vendor/tesseract/core/*.txt",
]
